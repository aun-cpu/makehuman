<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勉強タイマー</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eeec;--ink:#1b2a28;--sub:#5d6f6c;--line:#c6d2cf;--accent:#1d6b5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--ink:#e6efed;--sub:#93a7a3;--line:#2e3d3a;--accent:#6fd0b8}}
:root[data-theme="dark"]{--bg:#121917;--ink:#e6efed;--sub:#93a7a3;--line:#2e3d3a;--accent:#6fd0b8}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
.subject{font-size:clamp(1.8rem,8vw,3rem);font-weight:700;color:var(--accent);margin:0}
.time{font-size:clamp(4rem,22vw,9rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.btns{display:flex;gap:8px;margin-top:14px}
button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--sub);padding:10px 18px;border-radius:8px;cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700;min-width:120px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gauge{position:relative;width:min(78vw,320px);aspect-ratio:1}
.gauge svg{width:100%;height:100%}
.gauge circle{fill:none;stroke-width:12}
.trk{stroke:var(--line)}
.bar{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:565.49;stroke-dashoffset:0;transition:stroke-dashoffset .3s linear}
.gauge .subject{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 28px;font-size:clamp(1.4rem,7vw,2rem)}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
.sub{width:100%;max-width:420px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.sub label{display:block;color:var(--sub);font-size:.9rem}
.sub .row{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:6px}
input{font:inherit;width:90px;text-align:center;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px}
.stime{font-size:clamp(2.6rem,13vw,4.5rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin:6px 0}
.stime.over{color:#c0432b}
</style>
</head>
<body>
<div class="gauge" role="img" aria-label="残り時間のゲージ">
  <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="90"/><circle class="bar" id="bar" cx="100" cy="100" r="90" transform="rotate(-90 100 100)"/></svg>
  <p class="subject" id="subject"></p>
</div>
<div class="btns">
  <button class="main" id="go">開始</button>
  <button id="skip">次へ</button>
  <button id="reset">リセット</button>
</div>
<section class="sub">
  <label for="lim">課題の制限時間(分)</label>
  <div class="row"><input id="lim" type="number" min="1" step="1" value="30" inputmode="numeric"><span>分</span></div>
  <div class="stime" id="stime">30:00</div>
  <div class="btns" style="justify-content:center">
    <button class="main" id="sgo">開始</button>
    <button id="sreset">リセット</button>
  </div>
</section>
<script>
const STEPS=[{n:'英熟語',m:20},{n:'英語',m:180},{n:'休憩',m:30},{n:'英単語:紫',m:30},{n:'世界史 前半',m:120},{n:'世界史 後半',m:120}];
const $=id=>document.getElementById(id);
let idx=0,remain=STEPS[0].m*60000,endAt=0,running=false,finished=false,timer=null,ctx=null,started=false;

function fmt(ms){let s=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;
  const p=n=>String(n).padStart(2,'0');return h?`${h}:${p(m)}:${p(s)}`:`${p(m)}:${p(s)}`}

function beep(times,len){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<times;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);
    const t=ctx.currentTime+i*(len+.15);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.start(t);o.stop(t+len)}}catch(e){}}

function advance(){
  idx++;
  if(idx>=STEPS.length){finished=true;running=false;clearInterval(timer);remain=0;beep(3,.4);return}
  beep(2,.2);
}

function tick(){
  if(!running)return;
  const now=Date.now();remain=endAt-now;
  while(remain<=0&&!finished){endAt+=(idx+1<STEPS.length?STEPS[idx+1].m*60000:0);advance();if(finished)break;remain=endAt-now}
  render();
}

function render(){
  $('subject').textContent=finished?'おつかれさま':STEPS[idx].n;
  $('bar').style.strokeDashoffset=565.49*(finished?1:1-remain/(STEPS[Math.min(idx,STEPS.length-1)].m*60000));
  document.title=finished?'完了':(running?fmt(remain)+' '+STEPS[idx].n:'勉強タイマー');
  $('go').textContent=running?'一時停止':(finished?'もう一度':(started?'再開':'開始'));
}

function reset(){idx=0;remain=STEPS[0].m*60000;running=false;finished=false;started=false;clearInterval(timer);render()}

$('go').onclick=()=>{
  if(finished)reset();
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}
  if(running){remain=endAt-Date.now();running=false;clearInterval(timer)}
  else{started=true;running=true;endAt=Date.now()+remain;timer=setInterval(tick,250)}
  render();
};
$('skip').onclick=()=>{
  if(finished)return;
  const was=running;advance();
  if(!finished){remain=STEPS[idx].m*60000;endAt=Date.now()+remain}
  running=was&&!finished;if(!running)clearInterval(timer);render();
};
$('reset').onclick=reset;
render();

/* 課題用タイマー(メインとは独立) */
let sRemain=0,sEnd=0,sRun=false,sTimer=null,sStarted=false;
function sLoad(){const m=parseFloat($('lim').value);sRemain=(m>0?m:0)*60000;sRun=false;sStarted=false;clearInterval(sTimer);sRender()}
function sRender(){
  $('stime').textContent=fmt(sRemain);
  $('stime').classList.toggle('over',sStarted&&sRemain<=0);
  $('sgo').textContent=sRun?'一時停止':(sStarted?(sRemain>0?'再開':'もう一度'):'開始');
}
function sTick(){sRemain=sEnd-Date.now();if(sRemain<=0){sRemain=0;sRun=false;clearInterval(sTimer);beep(5,.3)}sRender()}
$('sgo').onclick=()=>{
  if(sRun){sRemain=sEnd-Date.now();sRun=false;clearInterval(sTimer);sRender();return}
  if(!sStarted||sRemain<=0)sLoad();
  if(sRemain<=0)return;
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}
  sStarted=true;sRun=true;sEnd=Date.now()+sRemain;sTimer=setInterval(sTick,250);sRender();
};
$('sreset').onclick=sLoad;
$('lim').addEventListener('input',()=>{if(!sRun)sLoad()});
sLoad();
</script>
</body>
</html>
