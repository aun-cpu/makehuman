<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>試験タイマー</title>
<style>
  :root { --bg:#10141a; --fg:#f2f5f9; --sub:#8b95a5; --accent:#ffd54a; --exam:#6fd3ff; --wait:#9be38a; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:2vmin;
  }
  #subject { font-size:12vmin; font-weight:700; letter-spacing:.1em; margin-bottom:2vmin; }
  #note { font-size:5vmin; color:var(--accent); min-height:7vmin; margin-bottom:1vmin; font-weight:600; }
  #main { display:flex; gap:6vw; justify-content:center; align-items:flex-end; flex-wrap:wrap; }
  .cell { display:flex; flex-direction:column; align-items:center; }
  .label { font-size:4.5vmin; color:var(--sub); margin-bottom:1vmin; }
  .big { font-size:30vmin; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .big small { font-size:.3em; margin-left:.1em; font-weight:600; }
  .multi .big { font-size:24vmin; }
  .done .big, .done .label { color:#4b5563; }
  #now { position:fixed; bottom:2vmin; right:3vmin; font-size:4vmin; color:var(--sub); font-variant-numeric:tabular-nums; }
  body.exam #subject { color:var(--exam); }
  body.wait #subject { color:var(--wait); }
  body.pre .big { color:var(--accent); }
</style>
</head>
<body class="wait">
  <div id="subject">--</div>
  <div id="note"></div>
  <div id="main"></div>
  <div id="now"></div>

<script>
// 時刻 "H:MM" → 分
const m = s => { const [h,mi] = s.split(':').map(Number); return h*60+mi; };

// type: wait=待機/休憩(現在時刻を表示), exam=試験(カウントダウン)
// ends: 終了時刻が複数あるものは全て表示
const SCHEDULE = [
  { start:'9:30',  end:'10:00', name:'待機',        type:'wait' },
  { start:'10:00', end:'11:30', name:'英語',        type:'exam', ends:['11:20','11:30'] },
  { start:'11:30', end:'12:30', name:'昼休憩',      type:'wait' },
  { start:'12:30', end:'14:00', name:'世界史',      type:'exam', ends:['13:30','14:00'] },
  { start:'14:00', end:'15:00', name:'待機',        type:'wait' },
  { start:'15:00', end:'16:00', name:'国語(その他)', type:'exam', ends:['16:00'] },
];
const PRE_MIN = 10; // 開始の何分前から「開始まであと」を出すか

// テスト用: ?t=10:55 で時刻を固定して確認できる
function getNow() {
  const q = new URLSearchParams(location.search).get('t');
  if (q) { const [h,mi] = q.split(':').map(Number); return h*60+mi+0.5; }
  const d = new Date();
  return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;
}
const pad = n => String(n).padStart(2,'0');
const clock = t => { const x = Math.floor(t); return Math.floor(x/60)+':'+pad(x%60); };

const $ = id => document.getElementById(id);

function cell(label, value, unit, cls='') {
  return `<div class="cell ${cls}"><div class="label">${label}</div><div class="big">${value}${unit?`<small>${unit}</small>`:''}</div></div>`;
}

function render() {
  const now = getNow();
  let subject, note = '', html = '', mode = 'wait';

  // 開始10分前（試験のみ）
  const upcoming = SCHEDULE.find(s => s.type==='exam' && m(s.start) > now && m(s.start) - now <= PRE_MIN);
  const cur = SCHEDULE.find(s => now >= m(s.start) && now < m(s.end));

  if (upcoming) {
    mode = 'pre';
    subject = upcoming.name;
    note = upcoming.start.replace(/^(\d+):/,'$1:') + ' 開始';
    const left = Math.ceil(m(upcoming.start) - now);
    html = cell('開始まであと', left, '分');
  } else if (cur && cur.type==='exam') {
    mode = 'exam';
    subject = cur.name;
    const multi = cur.ends.length > 1;
    html = cur.ends.map(e => {
      const left = Math.ceil(m(e) - now);
      return left > 0
        ? cell(e + ' 終了まで', left, '分')
        : cell(e + ' 終了', '終了', '', 'done');
    }).join('');
    $('main').classList.toggle('multi', multi);
  } else if (cur) {
    subject = cur.name;
    html = cell('現在時刻', clock(now), '');
  } else {
    subject = now < m(SCHEDULE[0].start) ? '試験前' : '終了';
    html = cell('現在時刻', clock(now), '');
  }

  document.body.className = mode;
  $('subject').textContent = subject;
  $('note').textContent = note;
  $('main').innerHTML = html;
  $('main').classList.toggle('multi', mode==='exam' && SCHEDULE.find(s=>s.name===subject).ends.length>1);
  $('now').textContent = clock(now);
}
render();
setInterval(render, 1000);
</script>
</body>
</html>
