<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ボーン制限テスト</title>
<style>
:root{--bg:#f2f5f6;--panel:#fff;--ink:#1a2328;--mute:#5a6870;--line:#d3dadd;--view:#e4eaec;--acc:#0e8a76;--warn:#d4501f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161a;--panel:#192026;--ink:#e6ecef;--mute:#92a1a9;--line:#2b353c;--view:#0d1114;--acc:#4fd1b8;--warn:#ff7a4d}}
:root[data-theme="dark"]{--bg:#11161a;--panel:#192026;--ink:#e6ecef;--mute:#92a1a9;--line:#2b353c;--view:#0d1114;--acc:#4fd1b8;--warn:#ff7a4d}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
.app{display:grid;grid-template-columns:1fr 340px;height:100%}
#view{position:relative;background:var(--view);min-height:0;overflow:hidden}
#view canvas{display:block;width:100%;height:100%}
#status{position:absolute;left:12px;top:10px;color:var(--mute);font-size:12px}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px;min-height:0}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:42% 58%}.panel{border-left:0;border-top:1px solid var(--line)}}
h2{font-size:13px;margin:16px 0 6px;color:var(--mute);font-weight:600}
h2:first-child{margin-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px 5px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.bones{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.bones button{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.bones button[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.bones button.hit{border-color:var(--warn);color:var(--warn)}
.row{margin:8px 0}
.row label{display:flex;justify-content:space-between;gap:8px}
.row small{color:var(--mute)}
.row.hit small{color:var(--warn)}
input[type=range]{width:100%;accent-color:var(--acc)}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.score div{border:1px solid var(--line);border-radius:8px;padding:6px 2px}
.score b{display:block;font-size:18px}
.score span{color:var(--mute);font-size:11px}
textarea{width:100%;height:150px;box-sizing:border-box;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12px/1.4 ui-monospace,Menlo,monospace}
.btns{display:flex;gap:6px;margin-top:6px}
.btns button{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--ink);font:inherit;cursor:pointer}
p.note{color:var(--mute);font-size:12px;margin:10px 0 0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div id="view"><div id="status">モデル読み込み中…</div></div>
  <div class="panel">
    <h2>シミュレーション</h2>
    <div class="btns"><button id="start" style="flex:1">開始</button><button id="stop" style="flex:1">ストップ</button></div>
    <div class="seg" style="margin-top:6px"><span style="padding:8px 6px">世代 <b id="e-gen">0</b></span><span style="padding:8px 6px">距離 <b id="e-dist">0.00</b> m</span><span style="padding:8px 6px">最高 <b id="e-best">0.00</b> m</span><span style="padding:8px 6px">状態 <b id="e-state">待機</b></span></div>
    <h2>ボーン</h2>
    <div class="bones" id="bones"></div>
    <h2 id="selname"></h2>
    <div id="axes"></div>
    <h2>設定</h2>
    <div class="row"><label>制限の倍率<small id="v-ls"></small></label><input type="range" id="ls" min="0.2" max="1.5" step="0.05" value="1"></div>
    <div class="row"><label>基準の振幅<small id="v-amp"></small></label><input type="range" id="amp" min="0.5" max="3" step="0.1" value="1"></div>
    <div class="row"><label>追従ゲイン<small id="v-gain"></small></label><input type="range" id="gain" min="1" max="30" step="1" value="12"></div>
    <div id="random-settings">
      <div class="row"><label>歩行変化速度<small id="v-rspeed"></small></label><input type="range" id="rspeed" min="0.2" max="3" step="0.1" value="1"></div>
      <div class="row"><label>歩行変異の大きさ<small id="v-ramp"></small></label><input type="range" id="ramp" min="0.1" max="1" step="0.05" value="0.65"></div>
    </div>
    <h2>採点（基準歩行）</h2>
    <div class="score"><div><b id="s-now">–</b><span>今の誤差°</span></div><div><b id="s-avg">–</b><span>平均誤差°</span></div><div><b id="s-hit">0</b><span>制限で止まる軸</span></div></div>
    <div class="btns"><button id="reset">採点をリセット</button></div>
    <h2>重心と足裏の圧力（体重に対する%）</h2>
    <canvas id="cv" width="600" height="360" style="width:100%;border:1px solid var(--line);border-radius:8px"></canvas>
    <div id="pr" style="color:var(--mute);font-size:12px;white-space:pre-line;margin-top:6px"></div>
    <h2>制限データ（limits.json）</h2>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="btns"><button id="apply">適用</button><button id="copy">コピー</button></div>
    <p class="note" id="msg">角度はすべて初期ポーズからの差です。学習個体は基準歩行を中心に振幅・位相・オフセット・周期を変異させます。現在は物理計算を切り離し、歩行の動きと前進だけを確認する簡易モードです。</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

// 基準歩行＋変異。
// 完全ランダムな姿勢は作らず、基準歩行の振幅・位相・オフセット・周期に
// 小さな変異を加えた「個体」を生成する。
const gait={
  period:1/0.9,
  speed:1,
  genome:null
};
function makeGenome(parent=null, mutation=0.16){
  const g={period:1,forward:1,items:{}};
  g.period=parent?parent.period*(1+randRange(-mutation,mutation)):1;
  g.forward=parent?parent.forward*(1+randRange(-mutation,mutation)):1;
  KEYS.forEach(k=>{
    g.items[k]={};
    ['x','y','z'].forEach(a=>{
      const p=parent?.items?.[k]?.[a];
      g.items[k][a]={
        amp:p?p.amp*(1+randRange(-mutation,mutation)):1+randRange(-mutation,mutation),
        phase:p?p.phase+randRange(-0.22,0.22):randRange(-0.12,0.12),
        offset:p?p.offset+randRange(-3,3):randRange(-1.5,1.5)
      };
    });
  });
  return g;
}
function initGait(parent=null){
  gait.genome=makeGenome(parent, parent?0.12:0.22);
  st.T=0;
}
function gaitRef(k,t){
  const g=gait.genome||makeGenome();
  const q=g.items[k]||{};
  const p=t*2*Math.PI*0.9*g.period + (q.x?.phase||0) + (/L$/.test(k)?0:Math.PI);
  const hip=28*Math.sin(p), o={x:0,y:0,z:0};
  switch(base(k)){
    case'足':o.x=-hip;o.z=3;break;
    case'ひざ':{const s=Math.max(0,Math.sin(p+1.4));o.x=5+55*s*s;break}
    case'足首':o.x=-8*Math.sin(p+0.5);break;
    case'腕':o.x=22*Math.sin(p);break;
    case'ひじ':o.x=-(15+10*(0.5-0.5*Math.sin(p)));break;
    case'上半身':o.x=3;o.y=6*Math.sin(t*2*Math.PI*0.9*g.period);break;
    case'上半身2':o.y=4*Math.sin(t*2*Math.PI*0.9*g.period);break;
    case'首':o.y=-3*Math.sin(t*2*Math.PI*0.9*g.period);break;
  }
  for(const a of ['x','y','z']){
    const m=q[a]||{amp:1,offset:0};
    o[a]=o[a]*(st.amp*m.amp)+m.offset;
  }
  return o;
}

// 互換用：ランダムモードも「基準歩行＋変異」から生成する。
function initRandom(){initGait(gait.genome);}
function randomRef(k,dt){st.T+=dt;return gaitRef(k,st.T);}

function ref(k,t){
  const p=t*2*Math.PI*0.9, ph=p+(/L$/.test(k)?0:Math.PI), hip=28*Math.sin(ph), a=st.amp, o={x:0,y:0,z:0};
  switch(base(k)){
    case'足':o.x=-hip;o.z=3;break;
    case'ひざ':{const s=Math.max(0,Math.sin(ph+1.4));o.x=5+55*s*s;break}
    case'足首':o.x=-8*Math.sin(ph+0.5);break;
    case'腕':o.x=22*Math.sin(ph);break;
    case'ひじ':o.x=-(15+10*(0.5-0.5*Math.sin(ph)));break;
    case'上半身':o.x=3;o.y=6*Math.sin(p);break;
    case'上半身2':o.y=4*Math.sin(p);break;
    case'首':o.y=-3*Math.sin(p);break;
  }
  o.x*=a;o.y*=a;o.z*=a;return o;
}

  $('#v-amp').textContent='×'+st.amp.toFixed(1);
  $('#v-gain').textContent=st.gain;
  $('#v-rspeed').textContent='×'+st.rspeed.toFixed(1);
  $('#v-ramp').textContent=Math.round(st.ramp*100)+'%';
}
function resetScore(){st.sum=0;st.n=0;$('#s-now').textContent=$('#s-avg').textContent='–'}
$('#start').onclick=()=>{
  st.mode='random';
  resetScore();
  startIndividual(true);
};
$('#stop').onclick=()=>{ finishIndividual(); };

['ls','amp','gain','rspeed','ramp'].forEach(id=>$('#'+id).oninput=e=>{
  st[id]=+e.target.value;
  resetScore();
});
$('#reset').onclick=resetScore;
function showJSON(){$('#json').value=JSON.stringify(L,null,1)}
$('#apply').onclick=()=>{try{const j=JSON.parse($('#json').value);
  for(const b of Object.keys(L)){for(const a of ['x','y','z']){const v=j[b][a];if(!(Array.isArray(v)&&v.length===2&&v[0]<=v[1]))throw new Error(b+'.'+a)}}
  L=j;resetScore();$('#msg').textContent='制限を適用しました。'}catch(e){$('#msg').textContent='JSONの形式が正しくありません: '+e.message}};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#json').value);$('#msg').textContent='コピーしました。リポジトリの rig/limits.json に貼り付けてください。'}catch(e){$('#msg').textContent='コピーできませんでした。テキストを選択してコピーしてください。'}};

// 重心と足裏圧力
function physics(){return null}
function overlay(r){}
// ===== 安全なメインループ =====
let last=performance.now();
let simFrame=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.033,Math.max(0,(now-last)/1000));
  last=now;
  const moving=evo.running;

  if(moving){
    st.T += dt * Math.max(0.1, gait.genome?.period || 1);
    const speed=1.20 * (gait.genome?.forward || 1);
    const ds=speed*dt;
    evo.distance += ds;
    if(model) model.position.z += ds*FZ;

    // 重力は使わず、まず歩行そのものが確実に見えることを確認する。
    // 基準歩行＋小さな変異だけをボーンへ反映する。
    KEYS.forEach(k=>{
      const tg=gaitRef(k,st.T);
      const next={x:0,y:0,z:0};
      for(const a of ['x','y','z']){
        const [lo,hi]=lim(k,a);
        next[a]=clamp(tg[a],lo,hi);
        act[k][a]=next[a];
      }
      setBone(k,next);
      hit[k]=(tg.x<lim(k,'x')[0]||tg.x>lim(k,'x')[1]||tg.y<lim(k,'y')[0]||tg.y>lim(k,'y')[1]||tg.z<lim(k,'z')[0]||tg.z>lim(k,'z')[1]);
    });

    // 明確な変化：歩行に合わせて胴体をわずかに上下させる。
    if(model){ model.position.y=0.06+0.06*Math.sin(st.T*2*Math.PI*0.9); model.rotation.y=0.035*Math.sin(st.T*2*Math.PI*0.9); }
    if(simFrame%6===0) updateEvoUI();
  }

  // キャラクターの前進分だけ、カメラ全体を同量移動。OrbitControlsは自由操作のまま。
  if(model){
    if(!cameraFollowPos) cameraFollowPos=model.position.clone();
    const delta=model.position.clone().sub(cameraFollowPos);
    if(delta.lengthSq()>1e-12){camera.position.add(delta);controls.target.add(delta);cameraFollowPos.copy(model.position);}
  }

  if(moving){
    let hits=0;KEYS.forEach(k=>{if(hit[k])hits++;});
    $('#s-hit').textContent=hits;
  }else $('#s-hit').textContent='0';
  if(simFrame%6===0) refreshUI();
  controls.update();
  renderer.render(scene,camera);
  simFrame++;
}
buildBones();showJSON();refreshUI();updateEvoUI();
</script>
